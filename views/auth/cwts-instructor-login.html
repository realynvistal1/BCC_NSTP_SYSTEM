<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   CWTS Instructor Portal | BCC NSTP
  </title>
  <link href="/assets/css/global.css" rel="stylesheet"/>
  <link href="/assets/css/login.css" rel="stylesheet"/>
  <link href="/assets/css/student-auth-mobile.css?v=20261015-instructor-compact" rel="stylesheet"/>
 </head>
 <body class="auth-page theme-cwts theme-cwts-instructor">
  <div class="auth-shell">
   <section class="auth-visual" style="--hero:url('/assets/images/cwts-login.png')">
    <div class="auth-visual-overlay">
    </div>
    <div class="auth-visual-content">
     <div class="auth-logo-wrap">
      <img alt="Buenavista Community College Logo" src="/assets/images/bcclogo-removebg-preview.png"/>
     </div>
     <h1>
      CWTS Instructor Portal
     </h1>
     <p>
      Manage attendance for your assigned CWTS groups.
     </p>
     <div class="partner-logos">
      <img alt="Organization logo" src="/assets/images/bcclogo-removebg-preview.png"/>
      <img alt="Organization logo" src="/assets/images/ched-logo.png"/>
      <img alt="Organization logo" src="/assets/images/cwts-logo.png"/>
      <img alt="Organization logo" src="/assets/images/tesda-rotc.png"/>
     </div>
     <div class="visual-dots">
      <i>
      </i>
      <i>
      </i>
      <i>
      </i>
     </div>
    </div>
   </section>
   <section class="auth-form-side">
    <div class="mobile-auth-hero" style="--hero:url('/assets/images/cwts-login.png')">
    </div>
    <div class="auth-card">
     <div class="mobile-brand">
      <img alt="BCC Logo" src="/assets/images/bcclogo-removebg-preview.png"/>
      <div class="student-login-brand-copy"><small>BCC NSTP</small><strong>CWTS Instructor</strong></div>
     </div>
     <div class="auth-heading">
      <div class="heading-icon">
       ✦
      </div>
      <div>
       <h2>
        Welcome back
       </h2>
       <p>
        Sign in to manage attendance.
       </p>
      </div>
     </div>
     <div class="notice hidden" id="msg" role="alert">
     </div>
     <form class="auth-form" data-portal="cwts-instructor" id="loginForm">
      <label>
       Email address
       <div class="input-shell">
        <span class="field-icon">
         ✉
        </span>
        <input autocomplete="username" name="email" placeholder="Email address" required="" type="email"/>
       </div>
      </label>
      <label>
       Password
       <div class="input-shell">
        <span class="field-icon">
         ●
        </span>
        <input autocomplete="current-password" name="password" placeholder="Password" required="" type="password"/>
        <button aria-label="Show password" class="password-toggle" type="button">
         Show
        </button>
       </div>
      </label>
      <div class="auth-row">
       <span>
       </span>
       <button class="link-button" onclick="showForgotMessage()" type="button">
        Forgot password?
       </button>
      </div>
      <button class="auth-submit cwts-submit" type="submit">
       Log In
      </button>
     </form>
    </div>
    <p class="auth-copyright">
     Buenavista Community College &copy; 2026
    </p>
   </section>
  </div>
  <script src="/assets/js/shared/api.js"></script>
  <script src="/assets/js/shared/layout.js?v=20261015-cwts-logins"></script>
  <script src="/assets/js/auth/login.js?v=20261015-instructor-compact">
  </script>
 </body>
</html>
