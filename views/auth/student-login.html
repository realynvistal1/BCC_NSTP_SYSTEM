<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Portal | BCC NSTP</title><link rel="icon" href="/assets/images/bcclogo-removebg-preview.png"><link rel="stylesheet" href="/assets/css/global.css"><link rel="stylesheet" href="/assets/css/login.css"><link rel="stylesheet" href="/assets/css/instructor-auth.css?v=20261109-circle-logos"></head>
<body class="instructor-auth ia-login" style="--login-photo:url('/assets/images/student-login.png')">
<main class="ia-login-shell">
  <section class="ia-welcome" aria-label="Student Portal">
    <a class="ia-brand" href="/student/login"><img src="/assets/images/bcclogo-removebg-preview.png" alt="BCC logo"><span><strong>BCC NSTP</strong><small>Buenavista Community College</small></span></a>
    <h1>Enrollment &amp; Attendance</h1><p>Buenavista Community College's ROTC &amp; CWTS management system for enrollment, attendance tracking, grades, and platoon coordination.</p>
    <div class="ia-partner-logos"><img src="/assets/images/bcclogo-removebg-preview.png" alt="Organization logo"><img src="/assets/images/ched-logo.png" alt="Organization logo"><img src="/assets/images/cwts-logo.png" alt="Organization logo"><img src="/assets/images/nstp-rotc.png" alt="Organization logo"></div>
  </section>
  <section class="ia-login-card" aria-labelledby="loginTitle">
    <div class="ia-card-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m3 8 9-5 9 5-9 5-9-5Z"/><path d="M6 10v6c4 3 8 3 12 0v-6M21 8v8"/></svg></div>
    <h2 id="loginTitle">Welcome back</h2><p>Sign in to your dashboard.</p>
    <div class="notice hidden" id="msg" role="alert"></div>
    <form class="auth-form" data-portal="student" id="loginForm">
      <label>Email Address<input name="email" type="email" placeholder="Enter your email" autocomplete="username" required></label>
      <label>Password<div class="input-shell ia-password"><input name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required><button class="password-toggle" type="button" aria-label="Show password">Show</button></div></label>
      <div class="ia-forgot"><button class="link-button" onclick="showForgotMessage()" type="button">Forgot password?</button></div>
      <button class="ia-primary" type="submit">Log In <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button>
    </form>
    <div class="ia-divider">OR</div><p class="ia-login-note">Don't have an account? <a href="/enrollment">Enroll Now</a></p>
  </section>
</main>
<script src="/assets/js/shared/api.js"></script><script src="/assets/js/shared/layout.js"></script><script src="/assets/js/auth/login.js"></script>
</body></html>
